# Configuración mínima del CLI de Supabase para este repositorio.
# El proyecto es `Transac` (docs/INFRAESTRUCTURA.md §10); el resto de la
# configuración vive en el panel y no se replica aquí.
project_id = "amuyclnyjyhigeyhuufs"

# La sesión del votante se verifica dentro de la función con `auth.getUser`,
# que acepta las claves publicables nuevas; la puerta de enlace no.
[functions.vincular-cuenta-unica]
verify_jwt = false

# Igual para el uso de la plataforma: la sesión y el correo se comprueban
# dentro de la función (docs/INFRAESTRUCTURA.md §10.12).
[functions.metricas-uso]
verify_jwt = false
