# El refresco de las instantáneas (docs/INFRAESTRUCTURA.md §6) y del texto de
# las sentencias, las leyes y los documentos (§5.12), sin nadie en el circuito.
#
# Tres trabajos con red y uno sin ella:
#  · fuentes: scripts/refrescar-fuentes.sh (los build-*.py en su orden);
#  · muestra: build-textos.mjs --muestra, que solo imprime extractos;
#  · textos: scripts/build-textos.mjs, con tope de tiempo y su caché: una
#    corrida que no termina deja lo leído y la siguiente sigue. Va después de
#    fuentes y de la muestra, que leen los mismos sitios: un lector por host;
#  · compilar: junta lo que trajeron, rehace todo lo derivado
#    (scripts/compilar-derivados.sh) y corre el gate completo
#    (.claude/hooks/verificar.sh --completo) sobre el árbol que se empuja. Solo
#    en verde hace el commit y lo empuja a la rama que lo pidió: en main, eso
#    despliega a producción, como cualquier push que pasa el gate.
#
# Cuándo corre:
#  · cada lunes a las 08:23 UTC (04:23 en Santo Domingo), fuentes y textos, en main;
#  · los demás días a las 09:47 UTC, solo textos, en main: pide únicamente lo que
#    no tiene fila final (lo nuevo y lo que no respondió), así que cuando todo
#    está leído no pide casi nada y compilar no hace commit;
#  · a mano (workflow_dispatch) con los pasos que se pidan;
#  · en un push a una rama claude/* cuyo mensaje diga «[refrescar: …]» con los
#    pasos (fuentes, textos, muestra, todo): así una sesión, que no tiene red
#    a los orígenes, pide la lectura y la recibe como un commit en su rama.
#
# Nunca evade un bloqueo: un host que responde 401/403/429/470 o un desafío se
# detiene y queda dicho en la instantánea y en el resumen.

name: Refrescar

on:
  schedule:
    - cron: "23 8 * * 1"
    - cron: "47 9 * * 0,2-6"
  workflow_dispatch:
    inputs:
      pasos:
        description: "fuentes, textos, muestra (separados por coma) o todo"
        required: true
        default: "todo"
      minutos:
        description: "Tope de la lectura de textos, en minutos (hasta 290)"
        required: false
        default: "290"
  push:
    branches: ["claude/**"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      fuentes: ${{ steps.p.outputs.fuentes }}
      textos: ${{ steps.p.outputs.textos }}
      muestra: ${{ steps.p.outputs.muestra }}
      claves: ${{ steps.p.outputs.claves }}
      minutos: ${{ steps.p.outputs.minutos }}
    steps:
      - id: p
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
          PEDIDOS: ${{ inputs.pasos }}
          MINUTOS: ${{ inputs.minutos }}
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          # El tope de la lectura: el pedido a mano, si es un entero entre 5 y 290; si no, 290.
          minutos="290"
          if printf '%s' "$MINUTOS" | grep -qE '^[0-9]{1,3}$' && [ "$MINUTOS" -ge 5 ] && [ "$MINUTOS" -le 290 ]; then minutos="$MINUTOS"; fi
          echo "minutos=$minutos" >> "$GITHUB_OUTPUT"
          case "$EVENTO" in
            schedule) if [ "$HORARIO" = "23 8 * * 1" ]; then pasos="fuentes,textos"; else pasos="textos"; fi ;;
            workflow_dispatch) pasos="$PEDIDOS" ;;
            push) pasos="$(printf '%s' "$MENSAJE" | grep -oE '\[refrescar: *[a-z, ]+\]' | head -1 | sed -E 's/^\[refrescar: *//; s/\]$//')" ;;
            *) pasos="" ;;
          esac
          pasos="$(printf '%s' "$pasos" | tr -d ' ')"
          [ "$pasos" = "todo" ] && pasos="fuentes,textos"
          for p in fuentes textos muestra; do
            if printf ',%s,' "$pasos" | grep -q ",$p,"; then echo "$p=1"; else echo "$p=0"; fi >> "$GITHUB_OUTPUT"
          done
          # «[claves: TC-0904-26,TSE-…]»: las que la muestra lee además de las repartidas.
          claves="$(printf '%s' "$MENSAJE" | grep -oE '\[claves: *[A-Za-z0-9=+/_,-]+\]' | head -1 | sed -E 's/^\[claves: *//; s/\]$//')"
          echo "claves=$claves" >> "$GITHUB_OUTPUT"
          echo "pasos: ${pasos:-ninguno}"

  muestra:
    needs: plan
    if: needs.plan.outputs.muestra == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - env:
          CLAVES: ${{ needs.plan.outputs.claves }}
        run: node --no-warnings scripts/build-textos.mjs --muestra 4 --minutos 45 ${CLAVES:+--claves "$CLAVES"}

  fuentes:
    needs: plan
    if: needs.plan.outputs.fuentes == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency: { group: "fuentes-${{ github.ref }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet xlrd==2.0.1 openpyxl==3.1.5 pypdf==6.17.0 pdfminer.six==20260107 brotli==1.1.0 numpy==2.5.3 tokenizers==0.23.3
      - run: npm ci --no-audit --no-fund
      - run: ./scripts/refrescar-fuentes.sh
      - name: Empaquetar lo que cambió
        # Solo los archivos de public/data que los scripts escribieron o borraron: así compilar no pisa lo
        # que otra sesión empujó mientras tanto. Nunca las fuentes crudas de nómina (nombres): quedan aquí.
        run: |
          git ls-files -m -o --exclude-standard -- public/data > cambiados.txt
          git ls-files -d -- public/data > borrados.txt
          wc -l cambiados.txt borrados.txt
          tar -cf fuentes.tar -T cambiados.txt borrados.txt .cache/refrescar/resumen.txt
      - uses: actions/upload-artifact@v4
        with: { name: fuentes, path: fuentes.tar, retention-days: 3 }

  textos:
    needs: [plan, fuentes, muestra]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.textos == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency: { group: "textos-${{ github.ref }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      # «v3»: la caché de antes guardaba el texto con cédulas; desde aquí se guarda sin ellas.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/textos
          key: textos-v3-${{ github.run_id }}
          restore-keys: textos-v3-
      - env:
          MINUTOS: ${{ needs.plan.outputs.minutos }}
        run: |
          set -o pipefail
          mkdir -p .cache
          node --no-warnings scripts/build-textos.mjs --minutos "$MINUTOS" | tee .cache/textos-corrida.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/textos
          key: textos-v3-${{ github.run_id }}
      # También si la lectura falló: la instantánea se guarda cada 5 minutos y lo leído hasta ahí vale.
      - name: Empaquetar lo leído
        if: always()
        run: |
          touch .cache/textos-corrida.txt
          if [ -d datos/textos ]; then tar -cf textos.tar datos/textos .cache/textos-corrida.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: textos, path: textos.tar, retention-days: 3, if-no-files-found: ignore }

  compilar:
    needs: [plan, fuentes, textos]
    if: always() && (needs.fuentes.result == 'success' || needs.textos.result == 'success' || needs.textos.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency: { group: "compilar-${{ github.ref }}", cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      # La punta de la rama al empezar, no el commit que pidió la corrida: lo derivado se compila con el código de ahora.
      # Sin el token en .git/config: los paquetes, el build y el gate corren sin poder empujar; el push lo pone a mano.
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 30, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet numpy==2.5.3 tokenizers==0.23.3
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { path: llegado }
      - name: Poner lo leído sobre el árbol
        run: |
          # Lo que los scripts cambiaron, encima de la punta de la rama; lo que borraron, borrado. Nada más.
          if [ -f llegado/fuentes/fuentes.tar ]; then
            mkdir -p llegado/f && tar -xf llegado/fuentes/fuentes.tar -C llegado/f
            if [ -d llegado/f/public/data ]; then cp -a llegado/f/public/data/. public/data/; fi
            if [ -s llegado/f/borrados.txt ]; then xargs -r -d '\n' rm -f -- < llegado/f/borrados.txt; fi
          fi
          if [ -f llegado/textos/textos.tar ]; then
            mkdir -p llegado/t && tar -xf llegado/textos/textos.tar -C llegado/t
            mkdir -p datos/textos && cp -a llegado/t/datos/textos/. datos/textos/
          fi
      - name: ¿Cambió algo?
        id: cambio
        run: |
          # Sin una instantánea nueva no hay nada que compilar: la corrida diaria que no encontró nada termina aquí.
          if [ -z "$(git status --porcelain -- public datos)" ]; then echo "si=0" >> "$GITHUB_OUTPUT"; echo "Nada cambió."; else echo "si=1" >> "$GITHUB_OUTPUT"; fi
      - name: Rehacer lo derivado
        if: steps.cambio.outputs.si == '1'
        run: ./scripts/compilar-derivados.sh
      - name: Commit, gate y push
        if: steps.cambio.outputs.si == '1'
        env:
          RAMA: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public datos
          if git diff --cached --quiet; then echo "Nada cambió."; exit 0; fi
          {
            echo "Refrescar las instantáneas del $(TZ=America/Santo_Domingo date +%F)"
            echo
            echo "Corrida automática de .github/workflows/refrescar.yml (docs/INFRAESTRUCTURA.md §6)."
            echo "El gate completo pasó sobre este árbol antes del push."
            if [ -f llegado/f/.cache/refrescar/resumen.txt ]; then echo; echo "Fuentes:"; cut -c1-160 llegado/f/.cache/refrescar/resumen.txt; fi
            if [ -f llegado/t/.cache/textos-corrida.txt ]; then echo; echo "Textos:"; grep -E '^textos:|^  [a-z0-9.-]+:' llegado/t/.cache/textos-corrida.txt | cut -c1-200; fi
          } > /tmp/mensaje.txt
          git commit -q -F /tmp/mensaje.txt
          rm -rf llegado
          ./.claude/hooks/verificar.sh --completo
          remoto="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for intento in 1 2; do
            if git push "$remoto" "HEAD:$RAMA"; then exit 0; fi
            # Otra sesión empujó mientras tanto: el gate va otra vez sobre el árbol rebasado.
            git fetch origin "$RAMA" && git rebase "origin/$RAMA" && ./.claude/hooks/verificar.sh --completo || exit 1
          done
          exit 1
